[package]
name = "gosh-distrobox-core"
version = "1.0.2"
edition = "2024"

# No `[lib] crate-type` override: the default `rlib` is what the workspace needs.
# The `staticlib`/`cdylib` pair existed only for the Flutter FFI, which S8 deletes;
# `frb_generated.rs` compiles identically as an rlib (architecture.md §1.3 S2).

[dependencies]
thiserror.workspace = true
async-channel.workspace = true
async-process.workspace = true
futures.workspace = true
anyhow.workspace = true
regex.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
# Crate-specific: deleted by S7 (T14) with the rest of the FRB layer, so it is
# deliberately not hoisted into [workspace.dependencies].
flutter_rust_bridge = "=2.11.1"
once_cell.workspace = true
tokio.workspace = true
uuid.workspace = true
dirs.workspace = true

[dev-dependencies]
smol.workspace = true
