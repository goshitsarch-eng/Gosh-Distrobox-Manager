[package]
name = "gosh-distrobox-core"
version = "1.0.2"
edition = "2024"

# No `[lib] crate-type` override: the default `rlib` is what the workspace needs.
# The `staticlib`/`cdylib` pair existed only for the Flutter FFI, which T14 (S8)
# has now removed; nothing links this crate from a non-Rust host.

[dependencies]
thiserror.workspace = true
async-channel.workspace = true
async-process.workspace = true
futures.workspace = true
anyhow.workspace = true
regex.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
smol.workspace = true
