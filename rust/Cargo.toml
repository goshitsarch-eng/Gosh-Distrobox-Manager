[package]
name = "gosh_distrobox_manager"
version = "1.0.2"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
thiserror = "1.0.64"
async-channel = "2.3.1"
async-process = "2.3.0"
futures = "0.3.31"
anyhow = "1.0.92"
regex = "1.11.1"
toml = "0.9.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
async-trait = "0.1.89"
flutter_rust_bridge = "=2.11.1"
once_cell = "1.19"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.10", features = ["v4", "fast-rng", "macro-diagnostics"] }
dirs = "5.0"

[dev-dependencies]
smol = "2.0.2"
