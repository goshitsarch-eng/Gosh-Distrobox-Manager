name: Rust

# The Rust gate stage (PLAN.md T0, REVIEW.md E8). Its job is to make
# architecture.md's safety story -- "every strip step compiles, tests and
# clippy-cleans" -- mechanically enforced rather than aspirational, and to be
# green from the first commit so the S1-S8 strip steps are never gated on a
# pre-existing red build.
#
# Scope: the whole workspace (`core/` lib + `app/` binary), reached through
# the virtual manifest and lockfile T1 hoisted to the repository root.
# Grown to `--workspace` in T4 (was single-crate until S5/T3 added `app/`).
#
# Not here, by design:
#   * the packaging-metadata job lives in packaging-metadata.yml (T4, §2.5.1
#     job 2) — `--check`, desktop/metainfo validation, check-versions.sh,
#     and the stdlib packaging tests. It is a separate job (not steps in
#     this file) so it runs in parallel and fails under its own name.
#   * the Flatpak build + smoke test live in flatpak.yml (T4 wires the file
#     T14 rewrites; tags + workflow_dispatch only, §2.5.1 job 3).
#
# `.github/workflows/flatpak.yml` was the old meson/ninja workflow and used to
# be dead as written (it built a root manifest that does not exist). T14 has
# since rewritten it to drive the full `./scripts/verify.sh` (stages 1-11) with
# the runtimes pre-installed, and T21 moved this job onto `verify.sh --fast`,
# so all three jobs now share one definition of green rather than three
# drifting re-spellings of it (AGENTS.md: CI runs the same script).

on:
  # Shape ported from the sibling's ci.yml (D24a). Note what the branch filter
  # does and does not save: GitHub fires `pull_request` on `synchronize`, i.e. on
  # every push to a branch that already has an open PR. So restricting `push`
  # avoids CI on work-in-progress branches *before* a PR exists; once review
  # starts, every push runs the full set regardless. That is deliberate -- it is
  # not a path filter and must not be turned into one.
  #
  # T14 removed the `cosmic-migration` entry this comment used to justify: the
  # migration branch is merged, so `main` is the only branch whose pushes gate
  # anything. The scheduled run below is what keeps an untouched dependency
  # from rotting between releases.
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Nightly, so a break on an untouched dependency or toolchain surfaces within
    # a day rather than at the next release.
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fast gate (verify.sh --fast, stages 1-8)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # libcosmic is a git dependency whose `iced` and `cosmic-icons`
          # submodules are path deps of it; cargo needs them present to resolve
          # the graph (REVIEW ARCH-Q14).
          submodules: recursive

      - name: Install Rust (stable, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Stage 6's validators: verify.sh --fast preflights them, so install
      # them here the same way packaging-metadata.yml does.
      - name: Install metadata validators
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils

      # The whole fast gate (stages 1-8: fmt, release build, clippy, tests,
      # versions, metadata, --check, packaging tests) via the one script, not
      # a re-spelled fmt/build/clippy/test — T21. `--locked` lives inside
      # verify.sh (D13/PKG-11: CI fails on a stale lockfile; the local loop
      # uses plain cargo commands without it).
      - name: Fast gate (verify.sh --fast, stages 1-8)
        run: ./scripts/verify.sh --fast
