name: Flatpak

# CI job 3 (packaging.md §2.5.1): full verify.sh (stages 1-10: the Rust gates
# re-run plus the offline flatpak-builder build + install + smoke test), then
# artifact publish on tags. Tags + workflow_dispatch ONLY — the full COSMIC
# build takes tens of minutes cold (§5.1) and does not belong on the per-push
# path. Per-push coverage is jobs 1-2 (rust.yml, packaging-metadata.yml).
# Redundant with them by design: a release artifact whose own tree fails fmt
# is not shippable, so the tag build certifies the whole gate independently.
#
# T4 wiring; T14 owns the release-shape rewrite (artifact names, release
# notes, the Flathub git-source switch per §4.2). What T4 guarantees: the job
# runs verify.sh stages 9-10 (NOT a re-spelled inline build) with the
# runtimes pre-installed, under xvfb for the smoke test.

on:
  push:
    tags: [ v*.*.* ]
  workflow_dispatch:

concurrency:
  group: flatpak
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flatpak:
    name: offline build + install + smoke test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flatpak, builder, xvfb, validators
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb appstream desktop-file-utils

      - name: Add Flathub remote
        run: |
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Pre-install runtime, SDK, BaseApp
        run: |
          flatpak --user install --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            com.system76.Cosmic.BaseApp//stable

      # Cache the flatpak build dir keyed on the vendoring inputs (§2.5/§5.1).
      # Invalidated by any dependency or manifest change — a stale cache here
      # is a stale build, so the key covers all three inputs, not just the lock.
      - name: Cache flatpak build dir
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-${{ runner.os }}-${{ hashFiles('flatpak/cargo-sources.json', 'flatpak/io.github.gosh_distrobox_manager.json', 'Cargo.lock') }}

      # Full verify.sh (stages 1-10), not just 9-10: the tag build must
      # certify the whole gate on the exact tree being released, independent
      # of what jobs 1-2 did on the branch head. Redundant with them by
      # design — a release artifact whose own tree fails fmt is not shippable.
      - name: Build, install, smoke-test (full verify.sh)
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 ./scripts/verify.sh
