[package]
# Binary name uses underscores (D15): this is what Cargo/desktop controls --
# `command:`, `Exec=`, and the installed `/app/bin/` entry. The `.spec` `Name:`
# stays hyphenated (RPM convention); that rename is T14's.
name = "gosh_distrobox_manager"
version = "1.0.2"
edition = "2024"

# Lib + thin bin (I31). The lib target exists so `app/tests/*.rs` can import the
# module tree: an integration test can only reach a *library*, so a binary-only
# crate made every page unreachable from a test. `main.rs` is now just the entry
# point. The module list lives in `src/lib.rs`.
[lib]
name = "gosh_distrobox_manager"
path = "src/lib.rs"

[[bin]]
name = "gosh_distrobox_manager"
path = "src/main.rs"

[dependencies]
# Single feature list lives in docs/migration/PLAN.md §1 (D12 as amended by
# D23): winit/tokio (executor + windowing), a11y (P0 screen-reader path),
# wayland/x11 (both display backends), multi-window (kept from default; the
# page-stack stays single-window, back affordance mandatory), about
# (widget::about()), xdg-portal (the only sandbox file-chooser route, D16).
# dbus-config is dropped (D23). Never: applet, desktop.
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "a401af8b1c54a8abd393b8c5b7c8809402f83850", default-features = false, features = ["winit", "tokio", "a11y", "wayland", "x11", "multi-window", "about", "xdg-portal"] }
gosh-distrobox-core = { path = "../core" }
# `serde` derive: the `CosmicConfigEntry` codegen in settings.rs emits bare
# `serde::` paths (same as libcosmic's own config module).
serde.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# i18n (T15): Fluent catalogue + compile-time embedding. These are app-only and
# are NOT new to the dependency graph — libcosmic already pulls all four
# transitively at exactly these versions (see Cargo.lock), which is why adding
# them needs no vendor regeneration. `generate-cargo-sources.py --check`
# (verify.sh stage 7) is the gate that proves it.
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"

[dev-dependencies]
smol.workspace = true
# Test-only, and deliberately not a normal dependency: the i18n tests name
# `FluentValue` to drive `get_args_concrete` over the whole catalogue with a
# numerically-typed `count`. The crate itself never names the type — `fl!`'s
# generated `args.insert(key, value.into())` is the only place it appears, and
# that resolves inside `i18n-embed-fl`'s own expansion.
fluent-bundle = "0.16"
