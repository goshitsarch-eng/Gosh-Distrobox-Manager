<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e3440;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b4252;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bf616a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d08770;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ebcb8b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d08770;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a3be8c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8fbcbb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5e81ac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81a1c1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="512" cy="512" r="480" fill="url(#bg)"/>
  
  <!-- Container stack (boxes) -->
  <!-- Bottom box (blue) -->
  <g transform="translate(512, 700)">
    <path d="M -200,-40 L -200,40 L -180,50 L 180,50 L 200,40 L 200,-40 L 180,-50 L -180,-50 Z" 
          fill="url(#box4)" stroke="#4c566a" stroke-width="4"/>
    <!-- Front face -->
    <path d="M -200,-40 L -200,40 L 200,40 L 200,-40 Z" fill="url(#box4)" opacity="0.9"/>
    <!-- Top face -->
    <path d="M -200,-40 L 0,-60 L 200,-40 L 180,-50 L -180,-50 Z" fill="#88c0d0" opacity="0.7"/>
    <!-- Side face -->
    <path d="M 200,-40 L 200,40 L 180,50 L 180,-50 Z" fill="#4c566a" opacity="0.5"/>
  </g>
  
  <!-- Second box (green) -->
  <g transform="translate(512, 550)">
    <path d="M -180,-40 L -180,40 L -160,50 L 160,50 L 180,40 L 180,-40 L 160,-50 L -160,-50 Z" 
          fill="url(#box3)" stroke="#4c566a" stroke-width="4"/>
    <path d="M -180,-40 L -180,40 L 180,40 L 180,-40 Z" fill="url(#box3)" opacity="0.9"/>
    <path d="M -180,-40 L 0,-60 L 180,-40 L 160,-50 L -160,-50 Z" fill="#a3be8c" opacity="0.8"/>
    <path d="M 180,-40 L 180,40 L 160,50 L 160,-50 Z" fill="#4c566a" opacity="0.5"/>
  </g>
  
  <!-- Third box (yellow) -->
  <g transform="translate(512, 400)">
    <path d="M -160,-40 L -160,40 L -140,50 L 140,50 L 160,40 L 160,-40 L 140,-50 L -140,-50 Z" 
          fill="url(#box2)" stroke="#4c566a" stroke-width="4"/>
    <path d="M -160,-40 L -160,40 L 160,40 L 160,-40 Z" fill="url(#box2)" opacity="0.9"/>
    <path d="M -160,-40 L 0,-60 L 160,-40 L 140,-50 L -140,-50 Z" fill="#ebcb8b" opacity="0.8"/>
    <path d="M 160,-40 L 160,40 L 140,50 L 140,-50 Z" fill="#4c566a" opacity="0.5"/>
  </g>
  
  <!-- Top box (red/orange) -->
  <g transform="translate(512, 250)">
    <path d="M -140,-40 L -140,40 L -120,50 L 120,50 L 140,40 L 140,-40 L 120,-50 L -120,-50 Z" 
          fill="url(#box1)" stroke="#4c566a" stroke-width="4"/>
    <path d="M -140,-40 L -140,40 L 140,40 L 140,-40 Z" fill="url(#box1)" opacity="0.9"/>
    <path d="M -140,-40 L 0,-60 L 140,-40 L 120,-50 L -120,-50 Z" fill="#d08770" opacity="0.8"/>
    <path d="M 140,-40 L 140,40 L 120,50 L 120,-50 Z" fill="#4c566a" opacity="0.5"/>
  </g>
  
  <!-- Terminal cursor indicator on top box -->
  <rect x="480" y="240" width="15" height="30" fill="#eceff4" opacity="0.8" rx="2"/>
</svg>
